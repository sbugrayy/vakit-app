name: vakit
description: "Diyanet uyumlu namaz vakitleri, kalıcı geri sayım bildirimi ve kıble pusulası."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  # Flutter 3.44.6'nın flutter_localizations'ı tam olarak intl 0.20.2
  # istiyor; daha yeni bir sürüme çekilirse `flutter pub get` çözülemiyor
  # (finans-app'te Dependabot iki kez kırdı). Flutter yükseltilmeden
  # dokunma.
  intl: 0.20.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
